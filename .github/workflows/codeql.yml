name: CodeQL

# GitHub's default code scanning can't build the app (it needs the prebuilt engine fetched first), so it quietly
# dropped Swift. This builds it the way CI does.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Cache the engine
        if: matrix.language == 'swift'
        uses: actions/cache@v4
        with:
          path: vendor/engine/Chromium Framework.framework
          key: engine-${{ hashFiles('vendor/engine/ENGINE') }}

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'swift'
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-build

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
