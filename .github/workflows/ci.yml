name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache the engine
        uses: actions/cache@v4
        with:
          path: vendor/engine/Chromium Framework.framework
          key: engine-${{ hashFiles('vendor/engine/ENGINE') }}

      # Incremental builds between runs: SwiftPM picks up where the last one stopped.
      - name: Cache the Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Sources/**/*.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # The bundle step also fails when a translation is missing a key.
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-build

      - name: Unit tests
        run: make test

      # Reports only until the code has had its first `make format`.
      - name: Formatting
        continue-on-error: true
        run: make lint

      - name: Check the bundle
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/Archidea.app
          plutil -lint build/Archidea.app/Contents/Info.plist
          [ "$(lipo -archs build/Archidea.app/Contents/MacOS/Archidea)" = arm64 ]

      - name: Starts and keeps running
        run: |
          set -euo pipefail
          data="$(mktemp -d)"
          DRIFT_DATA_DIR="$data" build/Archidea.app/Contents/MacOS/Archidea > "$RUNNER_TEMP/run.log" 2>&1 &
          pid=$!
          sleep 20
          kill -0 "$pid" || { echo "::error::Archidea exited on start"; cat "$RUNNER_TEMP/run.log"; exit 1; }
          kill "$pid"
